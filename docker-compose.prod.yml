name: aquastyle_crm

services:
  app:
    container_name: aquastyle_crm
    image: ${DOCKER_REPO:?DOCKER_REPO не задан}:${IMAGE_TAG:?IMAGE_TAG не задан}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${NGINX_HOST:-0.0.0.0}:${NGINX_PORT:?NGINX_PORT не задан в .env}:80"

    environment:
      PUID: ${HOST_UID:-1000}
      PGID: ${HOST_GID:-1000}
    volumes:
      - ./.env:/var/www/html/.env:ro
      - ./storage:/var/www/html/storage
    restart: unless-stopped

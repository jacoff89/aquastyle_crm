services:
  nginx:
    container_name: aquastyle_crm-nginx
    image: nginx:latest
    working_dir: /var/www/html
    depends_on:
      - php-fpm
    volumes:
      - .:/var/www/html
      - ./.docker/nginx/conf.d:/etc/nginx/conf.d
    ports:
      - "${NGINX_PORT}:80"
    restart: unless-stopped

  php-fpm:
    container_name: aquastyle_crm-php-fpm
    build:
      context: .docker/php-fpm
      args:
        UID: ${UID}
        GID: ${GID}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTP_PROXY}
      NO_PROXY: localhost,127.0.0.1,.local
    volumes:
      - .:/var/www/html
      - ./.docker/php-fpm/php-prod.ini:/etc/php/8.4/fpm/conf.d/99-prod.ini:ro
    restart: unless-stopped

  # Сборка фронтенда. Запускается вручную и после сборки останавливается:
  # docker compose -f docker-compose.prod.yml run --rm nodejs
  nodejs:
    container_name: aquastyle_crm-nodejs
    image: node:24
    profiles: ["build"]
    environment:
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTP_PROXY}
      NO_PROXY: localhost,127.0.0.1,.local
      HOME: /tmp
      NPM_CONFIG_CACHE: /tmp/.npm
    working_dir: /var/www/html
    user: "${UID}:${GID}"
    command: ["sh", "-c", "npm ci && npm run build"]
    volumes:
      - .:/var/www/html

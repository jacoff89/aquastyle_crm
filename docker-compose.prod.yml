services:
  nginx:
    container_name: aquastyle_crm-nginx
    image: nginx:latest
    working_dir: /var/www/html
    depends_on:
      - php-fpm
    volumes:
      - .:/var/www/html
      - ./.docker/nginx/conf.d:/etc/nginx/conf.d
    ports:
      - "${NGINX_PORT}:80"
    restart: unless-stopped

  php-fpm:
    container_name: aquastyle_crm-php-fpm
    build:
      context: .docker/php-fpm
      args:
        UID: ${UID}
        GID: ${GID}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTP_PROXY}
      NO_PROXY: localhost,127.0.0.1,.local
    volumes:
      - .:/var/www/html
    restart: unless-stopped